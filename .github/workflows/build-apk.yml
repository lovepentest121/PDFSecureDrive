name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install fixed debug keystore
        run: |
          mkdir -p $HOME/.android
          cp keystore/debug.keystore $HOME/.android/debug.keystore

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Print signing SHA-1 (add to Google Cloud Console)
        run: |
          echo ""
          echo "======================================================"
          echo "  ADD THIS SHA-1 TO GOOGLE CLOUD CONSOLE (OAuth 2.0)"
          echo "======================================================"
          keytool -list -keystore $HOME/.android/debug.keystore \
            -alias androiddebugkey -storepass android -v 2>&1 | grep "SHA1:"
          echo "======================================================"
          echo ""

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFSecureDrive-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Delete old release if exists
        run: gh release delete latest-build --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest APK Build"
          body: "Auto-built APK — PDF Secure Drive v2 with cover preview, AI title & VirusTotal scanning"
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
